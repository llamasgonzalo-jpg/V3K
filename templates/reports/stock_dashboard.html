{% extends "base.html" %}
{% block title %}Dashboard de Stock{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="section-title mb-0"><i class="bi bi-boxes"></i> Dashboard de Stock por Estado</h4>
    <a href="{{ url_for('reports.index') }}" class="btn btn-outline-secondary btn-sm">Volver</a>
</div>
<div class="row g-3">
{% for status, count, weight in status_counts %}
<div class="col-md-4"><div class="card"><div class="card-body text-center">
    <span class="badge bg-{{ 'success' if status=='Deposito' else 'info' if status=='Seco' else 'warning' if status in ('Secando','Curando') else 'danger' if status=='Retenido' else 'secondary' }} fs-6">{{ status }}</span>
    <h2 class="mt-2">{{ count }}</h2><small class="text-muted">batches</small>
    <h4 class="text-primary">{{ weight or 0 }} kg</h4><small class="text-muted">peso total</small>
</div></div></div>
{% endfor %}
</div>
{% endblock %}
