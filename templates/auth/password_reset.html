{% extends "base.html" %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block public_content %}
<div class="login-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 class="mb-3">Recuperar Contraseña</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email registrado</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Enviar enlace</button>
                <a href="{{ url_for('auth.login') }}" class="btn btn-link w-100">Volver al login</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
