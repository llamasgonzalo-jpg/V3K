{% extends "base.html" %}
{% block title %}Depósitos{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="section-title mb-0"><i class="bi bi-house-door"></i> Depósitos / Almacenes</h4>
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newModal">+ Nuevo</button>
</div>
<div class="card"><div class="card-body p-0">
<table class="table table-hover mb-0">
    <thead><tr><th>Nombre</th><th>Sitio</th><th></th></tr></thead>
    <tbody>
    {% for w in warehouses %}
    <tr><td><strong>{{ w.name }}</strong></td><td>{{ w.site.name if w.site else '-' }}</td>
        <td><button class="btn btn-outline-primary btn-action" data-bs-toggle="modal" data-bs-target="#edit{{ w.id }}">Editar</button></td></tr>
    <div class="modal fade" id="edit{{ w.id }}"><div class="modal-dialog"><div class="modal-content">
        <form method="POST" action="{{ url_for('master.warehouse_save') }}"><input type="hidden" name="warehouse_id" value="{{ w.id }}">
        <div class="modal-header"><h5>Editar</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-2"><label>Nombre *</label><input type="text" name="name" class="form-control" value="{{ w.name }}" required></div>
            <div class="mb-2"><label>Sitio</label><select name="site_id" class="form-select"><option value="">--</option>{% for s in sites %}<option value="{{ s.id }}" {{ 'selected' if w.site_id==s.id }}>{{ s.name }}</option>{% endfor %}</select></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-success">Guardar</button></div></form>
    </div></div></div>
    {% endfor %}
    </tbody>
</table></div></div>
<div class="modal fade" id="newModal"><div class="modal-dialog"><div class="modal-content">
    <form method="POST" action="{{ url_for('master.warehouse_save') }}">
    <div class="modal-header"><h5>Nuevo Depósito</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-2"><label>Nombre *</label><input type="text" name="name" class="form-control" required></div>
        <div class="mb-2"><label>Sitio</label><select name="site_id" class="form-select"><option value="">--</option>{% for s in sites %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
    </div>
    <div class="modal-footer"><button type="submit" class="btn btn-success">Crear</button></div></form>
</div></div></div>
{% endblock %}
