<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar — V3K Network</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/network.css') }}" rel="stylesheet">
</head>
<body class="network">

<div class="nw-auth-wrap">
<div class="nw-auth-card">
    <div class="nw-auth-logo">
        <a href="{{ url_for('reprocann.home') }}"><img src="{{ url_for('static', filename='img/v3k-network-logo.png') }}" alt="V3K Network"></a>
    </div>
    <h1 class="nw-auth-title">Ingresar</h1>
    <p class="nw-auth-sub">A tu cuenta de V3K Network</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
    <div class="nw-alert nw-alert-{{ 'danger' if cat=='danger' else cat }}"><i class="bi bi-info-circle"></i> {{ msg }}</div>
    {% endfor %}{% endif %}{% endwith %}

    <form method="POST">
        <div class="nw-form-group">
            <label class="nw-label">Usuario o email</label>
            <input type="text" name="username" class="nw-input" required autofocus>
        </div>
        <div class="nw-form-group">
            <label class="nw-label">Contraseña</label>
            <input type="password" name="password" class="nw-input" required>
        </div>
        <button type="submit" class="nw-btn nw-btn-primary nw-btn-block" style="padding:12px;">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
    </form>

    <p class="nw-auth-foot">¿No tenés cuenta? <a href="{{ url_for('reprocann.registro') }}">Registrate gratis</a></p>
</div>
</div>

</body>
</html>
