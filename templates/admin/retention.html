{% extends "base.html" %}
{% block title %}Retención{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="section-title mb-0"><i class="bi bi-archive"></i> Políticas de Retención</h4>
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newModal">+ Nueva</button>
</div>
<div class="card"><div class="card-body p-0">
<table class="table table-hover mb-0">
    <thead><tr><th>Tipo de Registro</th><th>Años de Retención</th><th></th></tr></thead>
    <tbody>
    {% for r in items %}
    <tr><td>{{ r.record_type }}</td><td>{{ r.retention_years }} años</td>
        <td><button class="btn btn-outline-primary btn-action" data-bs-toggle="modal" data-bs-target="#edit{{ r.id }}">Editar</button></td></tr>
    <div class="modal fade" id="edit{{ r.id }}"><div class="modal-dialog"><div class="modal-content">
        <form method="POST"><input type="hidden" name="item_id" value="{{ r.id }}">
        <div class="modal-header"><h5>Editar</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-2"><label>Tipo de registro</label><input type="text" name="record_type" class="form-control" value="{{ r.record_type }}" required></div>
            <div class="mb-2"><label>Años</label><input type="number" name="retention_years" class="form-control" value="{{ r.retention_years }}" required></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-success">Guardar</button></div></form>
    </div></div></div>
    {% endfor %}
    </tbody>
</table></div></div>
<div class="modal fade" id="newModal"><div class="modal-dialog"><div class="modal-content">
    <form method="POST"><div class="modal-header"><h5>Nueva Política</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-2"><label>Tipo de registro *</label><input type="text" name="record_type" class="form-control" required></div>
        <div class="mb-2"><label>Años de retención *</label><input type="number" name="retention_years" class="form-control" required></div>
    </div>
    <div class="modal-footer"><button type="submit" class="btn btn-success">Crear</button></div></form>
</div></div></div>
{% endblock %}
