{% extends "base.html" %}
{% block title %}Proveedores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="section-title mb-0"><i class="bi bi-shop"></i> Proveedores</h4>
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newModal">+ Nuevo</button>
</div>
<div class="card"><div class="card-body p-0">
<table class="table table-hover mb-0">
    <thead><tr><th>Nombre</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th></th></tr></thead>
    <tbody>
    {% for s in items %}
    <tr><td><strong>{{ s.name }}</strong></td><td>{{ s.contact or '-' }}</td><td>{{ s.phone or '-' }}</td><td>{{ s.email or '-' }}</td>
        <td><button class="btn btn-outline-primary btn-action" data-bs-toggle="modal" data-bs-target="#edit{{ s.id }}">Editar</button></td></tr>
    <div class="modal fade" id="edit{{ s.id }}"><div class="modal-dialog"><div class="modal-content">
        <form method="POST"><input type="hidden" name="item_id" value="{{ s.id }}">
        <div class="modal-header"><h5>Editar Proveedor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-2"><label>Nombre *</label><input type="text" name="name" class="form-control" value="{{ s.name }}" required></div>
            <div class="mb-2"><label>Contacto</label><input type="text" name="contact" class="form-control" value="{{ s.contact or '' }}"></div>
            <div class="mb-2"><label>Teléfono</label><input type="text" name="phone" class="form-control" value="{{ s.phone or '' }}"></div>
            <div class="mb-2"><label>Email</label><input type="email" name="email" class="form-control" value="{{ s.email or '' }}"></div>
            <div class="mb-2"><label>Dirección</label><textarea name="address" class="form-control" rows="2">{{ s.address or '' }}</textarea></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-success">Guardar</button></div></form>
    </div></div></div>
    {% endfor %}
    </tbody>
</table></div></div>
<div class="modal fade" id="newModal"><div class="modal-dialog"><div class="modal-content">
    <form method="POST"><div class="modal-header"><h5>Nuevo Proveedor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-2"><label>Nombre *</label><input type="text" name="name" class="form-control" required></div>
        <div class="mb-2"><label>Contacto</label><input type="text" name="contact" class="form-control"></div>
        <div class="mb-2"><label>Teléfono</label><input type="text" name="phone" class="form-control"></div>
        <div class="mb-2"><label>Email</label><input type="email" name="email" class="form-control"></div>
        <div class="mb-2"><label>Dirección</label><textarea name="address" class="form-control" rows="2"></textarea></div>
    </div>
    <div class="modal-footer"><button type="submit" class="btn btn-success">Crear</button></div></form>
</div></div></div>
{% endblock %}
